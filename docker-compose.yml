services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: container_truck_queue_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60 --access-logfile - --error-logfile -
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/login/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
